name: Build Blink IPA (for sideloading with a free Apple ID)

# Builds Blink Shell from its public GPL-3.0 source (https://github.com/blinksh/blink) on a GitHub
# macOS runner and produces unsigned .ipa files. Nothing from the author's paid App Store build is
# used; this is the "build it yourself" route the Blink README describes.
#
# Result (Actions -> the run -> Artifacts):
#   Blink-noext-unsigned.ipa  <- install this one with a FREE Apple ID (Sideloadly / AltStore)
#   Blink-full-unsigned.ipa   <- includes the File Provider extensions (needs a paid account)
#   build-log-tail            <- the last part of the build log, for debugging

on:
  workflow_dispatch:
    inputs:
      blink_ref:
        description: "Blink branch or tag to build (empty = its default branch)"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUNDLE_ID: com.suryadragn.blink

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Use the newest Xcode 16
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          sw_vers

      - name: Get the Blink source
        env:
          REF: ${{ github.event.inputs.blink_ref }}
        run: |
          if [ -n "$REF" ]; then BRANCH="--branch $REF"; else BRANCH=""; fi
          git clone --depth 1 --recursive $BRANCH https://github.com/blinksh/blink.git blink
          git -C blink log -1 --format='Blink commit: %h %ad %s' --date=short

      - name: Prebuilt frameworks and resources
        working-directory: blink
        run: |
          ./get_frameworks.sh
          ./get_resources.sh

      - name: Local settings (no team, own bundle id)
        working-directory: blink
        run: |
          cp template_setup.xcconfig developer_setup.xcconfig
          sed -i '' \
            -e "s/^TEAM_ID = .*/TEAM_ID = /" \
            -e "s/^BUNDLE_ID = .*/BUNDLE_ID = ${BUNDLE_ID}/" \
            -e "s/^GROUP_ID .*/GROUP_ID = ${BUNDLE_ID}/" \
            -e "s/^CLOUD_ID = .*/CLOUD_ID = ${BUNDLE_ID}/" \
            -e "s/^KEYCHAIN_ID1 = .*/KEYCHAIN_ID1 = ${BUNDLE_ID}/" \
            developer_setup.xcconfig
          grep -E "^(TEAM_ID|BUNDLE_ID|GROUP_ID|CLOUD_ID|KEYCHAIN_ID1)" developer_setup.xcconfig

      - name: Build the app (archive, unsigned)
        working-directory: blink
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Blink.xcodeproj -scheme Blink -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Blink.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "^(\*\*|Build|Archive|note: Using|Compiling|Ld )" | tail -n 60

      - name: Show the first errors (so they appear as annotations)
        if: failure()
        run: |
          grep -E "error:|\*\* ARCHIVE FAILED|\*\* BUILD FAILED" "$RUNNER_TEMP/build.log" | head -n 20 | while IFS= read -r line; do
            echo "::error::${line:0:380}"
          done
          tail -n 120 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/build-log-tail.txt" || true

      - name: Package the IPAs
        run: |
          APP=$(find "$RUNNER_TEMP/Blink.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)
          echo "App: $APP"
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")

          # Only what a free Apple ID can use: the app group. iCloud, push, keychain groups,
          # associated domains, user fonts and the web-browser entitlement need a paid account.
          cat > "$RUNNER_TEMP/blink.entitlements" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.application-groups</key>
            <array><string>group.${BUNDLE_ID}</string></array>
          </dict>
          </plist>
          PLIST
          brew install ldid
          ldid -S"$RUNNER_TEMP/blink.entitlements" "$APP/$EXE"

          mkdir -p out/full/Payload out/noext/Payload
          cp -R "$APP" out/full/Payload/
          cp -R "$APP" out/noext/Payload/
          rm -rf out/noext/Payload/*.app/PlugIns       # extensions need extra App IDs
          (cd out/full  && zip -qry ../Blink-full-unsigned.ipa  Payload)
          (cd out/noext && zip -qry ../Blink-noext-unsigned.ipa Payload)
          ls -lh out/*.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" || true

      - name: Upload the IPAs
        uses: actions/upload-artifact@v4
        with:
          name: Blink-ipa
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload the log tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-tail
          path: ${{ runner.temp }}/build-log-tail.txt
          if-no-files-found: ignore
          retention-days: 7
